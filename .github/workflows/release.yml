name: Release

# Push a tag photoshop-v<version> (PLUGIN_VERSION in core/constants.js, which
# build.py checks against manifest.json) and this builds
# nolgia-photoshop-<version>.ccx and attaches it to a draft release of that
# tag. Publish the draft by hand after reading it; the website links to the
# file by that exact name. A file that is already on the release is never
# replaced.

on:
  push:
    tags: ["photoshop-v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and attach the .ccx
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build
        run: |
          version="${GITHUB_REF_NAME#photoshop-v}"
          plugin=$(sed -nE 's/^ *PLUGIN_VERSION: "([^"]+)",$/\1/p' core/constants.js)
          if [ "$version" != "$plugin" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match PLUGIN_VERSION $plugin in core/constants.js"
            exit 1
          fi
          python3 build.py --out "$RUNNER_TEMP/dist"
          out="$RUNNER_TEMP/dist/nolgia-photoshop-$version.ccx"
          test -f "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$OUT"
          else
            gh release create "$GITHUB_REF_NAME" "$OUT" --draft --verify-tag \
              --title "NOLGIA for Photoshop $VERSION" \
              --notes "NOLGIA for Photoshop $VERSION (Photoshop 2024, version 25.0, and newer). Double-click nolgia-photoshop-$VERSION.ccx to install it. See the README."
          fi
